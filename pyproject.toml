[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-workbench"
version = "0.2.0"
description = "The manuscript workspace and revision app, built on the PeerReviewAgents review engine"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
# PeerReviewAgents runs the review (a panel of headless Claude Code agents run
# by its own Python) and owns ingest and the domain packs. The app imports it directly.
# The engine is not released yet, so it is pinned to one commit of its main
# branch as GitHub's archive of that commit, with the archive's hash.
dependencies = [
    "peerreviewagents @ https://github.com/pgarrett-scripps/PeerReviewAgents/archive/d702d895c0b467f482fdc87f612076f7220eccaa.tar.gz#sha256=33f38e9475e7b39dadf43d40371996a4e907518c49608339555924aa0f4f116a",
]

[project.optional-dependencies]
documents = ["Pillow", "python-docx", "lxml", "pypdf"]
test = ["Pillow", "python-docx", "lxml", "pypdf", "openpyxl"]

[project.scripts]
paper-workbench = "paper_workspace.__main__:main"

[tool.setuptools]
# Ship only the package-data globs below. The domain packs now come from the engine.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["paper_workspace*"]
namespaces = false

[tool.setuptools.package-data]
paper_workspace = ["web/*", "README.md"]
