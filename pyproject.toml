[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-workbench"
version = "0.2.0"
description = "The manuscript workspace and revision app, built on the PeerReviewAgents review engine"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
# PeerReviewAgents runs the review (the pra plugin in a headless Claude Code
# session) and owns ingest and the domain packs. The app imports it directly.
dependencies = ["peerreviewagents>=0.9.0"]

[project.optional-dependencies]
documents = ["Pillow", "python-docx", "lxml", "pypdf"]
test = ["Pillow", "python-docx", "lxml", "pypdf", "openpyxl"]

[project.scripts]
paper-workbench = "paper_workspace.__main__:main"

[tool.setuptools]
# Ship only the package-data globs below. The domain packs now come from the engine.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["paper_workspace*"]
namespaces = false

[tool.setuptools.package-data]
paper_workspace = ["web/*", "README.md"]
